[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qslrm-medasarithmania"
version = "1.0.0"
description = "QSLRM — Hypothesis Triage & Signal Attribution Engine for translational ADR risk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MedasArithmania" }]
dependencies = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pandas>=2.2.3",
  "numpy>=2.1.0",
  "scipy>=1.14.0",
  "httpx>=0.28.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
qslrm-seed = "scripts.seed_db:main"
qslrm-migrate = "scripts.migrate:main"
qslrm-bootstrap = "scripts.bootstrap_db:main"
qslrm-phase0-check = "scripts.phase0_check:main"
qslrm-phase1 = "scripts.run_phase1:main"
qslrm-phase2 = "scripts.run_phase2:main"
qslrm-phase3 = "scripts.run_phase3:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "qslrm_erd*",
  "ingest*",
  "signals*",
  "fusion*",
  "omic_engine*",
  "stream*",
  "api*",
  "app*",
  "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
