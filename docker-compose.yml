services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslrm
      POSTGRES_PASSWORD: qslrm
      POSTGRES_DB: qslrm
    ports:
      - "5432:5432"
    volumes:
      - qslrm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qslrm -d qslrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://qslrm:qslrm@db:5432/qslrm
      MODEL_VERSION: qslrm-v1.0.0
      MVP_DRUG_CLASS: kinase_inhibitor
      QSLRM_BOOTSTRAP: "1"
      QSLRM_SEED_PIPELINE: "1"
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5

volumes:
  qslrm_pg:
