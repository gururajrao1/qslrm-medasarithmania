# Render free web service — SQLite snapshot baked in (no paid DB)
services:
  - type: web
    name: qslrm-medasarithmania
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/processed/qslrm.db
      - key: MODEL_VERSION
        value: qslrm-v1.0.0
      - key: QSLRM_BOOTSTRAP
        value: "0"
      - key: QSLRM_SEED_PIPELINE
        value: "0"
      - key: HOST
        value: "0.0.0.0"
